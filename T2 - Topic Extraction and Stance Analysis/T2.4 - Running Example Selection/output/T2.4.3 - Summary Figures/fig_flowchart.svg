   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="36.367594" transform="rotate(-0 22.0608 36.367594)">Stage 3 output</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 31.260797)">29,971 legislator stance records (one member position: cited sentences, an issue, support or concern) placed on the</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 41.014547)">111 codebook topics; House Science and Senate Commerce hearings held 1999-2025</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="108.962344" transform="rotate(-0 22.0608 108.962344)">Candidate pool</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="98.784" y="108.722109" transform="rotate(-0 98.784 108.722109)">The 30 topics with the most records (374 to 1,369 records each)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="181.538344" transform="rotate(-0 22.0608 181.538344)">Step 1: screen</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 176.421234)">Three numeric criteria on every topic: enough records, enough support and concern, a clean shift across</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 186.174984)">administrations or around an event</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="254.114344" transform="rotate(-0 22.0608 254.114344)">Step 1: read</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 248.997234)">40 sampled source sentences per passing topic: is it one topic, and does "concern" mean concern about a harm or</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 258.750984)">opposition to a rule?</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="326.690344" transform="rotate(-0 22.0608 326.690344)">Step 2: audit</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 321.564797)">Every record of each candidate read and coded by hand: is the label right, which angle of the topic, and which</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 331.318547)">direction (favoring more or less of the policy)</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="22.0608" y="399.266344" transform="rotate(-0 22.0608 399.266344)">Best cases</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 394.140797)">Direction shifts over time: 78 EPA regulations, 26 renewable energy. Direction constant, only the angle shifts: 68</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #36454f" transform="translate(98.784 403.894547)">consumer privacy, 21 nuclear R&amp;D</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="65.2176" y="145.010109" transform="rotate(-0 65.2176 145.010109)">30 topics</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="65.2176" y="217.586109" transform="rotate(-0 65.2176 217.586109)">13 of 30 pass</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="65.2176" y="290.153672" transform="rotate(-0 65.2176 290.153672)">4 candidates: 78, 26, 68, 21 (plus 65, a sibling of 68)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start; fill: #36454f" x="65.2176" y="362.738109" transform="rotate(-0 65.2176 362.738109)">2,589 records coded</text>
   </g>
  </g>
 </g>
